version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: lab3_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab3_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lab3_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  parser:
    build:
      context: ./parser_service
      dockerfile: Dockerfile
    container_name: lab3_parser
    ports:
      - "8001:8001"
    restart: on-failure

  api:
    build:
      context: ./api_service
      dockerfile: Dockerfile
    container_name: lab3_api
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+psycopg2://postgres:postgres@db:5432/lab3_db
      REDIS_URL: redis://redis:6379/0
      PARSER_SERVICE_URL: http://parser:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      parser:
        condition: service_started
    restart: on-failure

  celery_worker:
    build:
      context: ./api_service
      dockerfile: Dockerfile
    container_name: lab3_celery_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    environment:
      DB_URL: postgresql+psycopg2://postgres:postgres@db:5432/lab3_db
      REDIS_URL: redis://redis:6379/0
      PARSER_SERVICE_URL: http://parser:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      parser:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
